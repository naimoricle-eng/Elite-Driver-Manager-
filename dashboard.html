<script type="module">

import { auth , db } from "./js/firebase.js";

import {
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
startTracking
} from "./js/tracking.js";
onAuthStateChanged(auth,(user)=>{

if(user){

startTracking(user.uid);

}

});


import {
doc,
getDoc,
collection,
addDoc,
serverTimestamp,
updateDoc,
query,
where,
getDocs
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let driverName = "Unknown";
let userRole = "driver";
let driverPosition = "";
let driverEmail = "";
let otRate = 20;
let userReady = false;
let currentUser = null;


// ===============================
// SAVE TRACKING LOCATION
// ===============================

async function saveTracking(lat, lon, status){

    let attendanceID = localStorage.getItem("attendanceID");

    if(!attendanceID){
        console.log("Tiada attendance ID");
        return;
    }


    let place = await getLocationName(lat, lon);


    await addDoc(
        collection(
            db,
            "attendance",
            attendanceID,
            "tracking"
        ),
        {
            latitude: lat,
            longitude: lon,
            place: place,
            status:status,
            time: serverTimestamp()
        }
    );


    console.log("Tracking saved:", place);

}
onAuthStateChanged(auth, async(user)=>{

if(user){

currentUser = user;

const userDoc = await getDoc(
doc(db,"users",user.uid)
);


if (userDoc.exists()) {

    const data = userDoc.data();

    driverName = data.name;
    userRole = data.role;
    driverPosition = data.position;
    driverEmail = data.email;
    otRate = data.otRate;

    userReady = true;
}

}

});




function getDistance(lat1,lon1,lat2,lon2){

let R = 6371000;

let dLat = (lat2-lat1)*Math.PI/180;
let dLon = (lon2-lon1)*Math.PI/180;


let a =
Math.sin(dLat/2)**2 +
Math.cos(lat1*Math.PI/180) *
Math.cos(lat2*Math.PI/180) *
Math.sin(dLon/2)**2;


return R * 2 * Math.atan2(
Math.sqrt(a),
Math.sqrt(1-a)
);

}
function stopTracking(){

    if(watchID !== null){

        navigator.geolocation.clearWatch(watchID);

        watchID = null;

        console.log("Tracking dihentikan");

    }


}
// ===============================
// GET NAMA TEMPAT
// ===============================

async function getLocationName(lat, lon){

    try{

        const response = await fetch(
        `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`
        );


        const data = await response.json();


        return data.display_name;


    }catch(error){

        return "Lokasi tidak diketahui";

    }

}





// ===============================
// CHECK IN
// ===============================

document.getElementById("btn-checkin").onclick=async function(){

if(!currentUser){
alert("Sila tunggu sistem siap loading");
return;
}


// SEMAK CHECK IN AKTIF





let now=new Date();


localStorage.setItem(
"checkIn",
now
);


localStorage.setItem(
"status",
"Driving"
);



document.getElementById("status").innerHTML="Driving";

document.getElementById("dashStatus").innerHTML="Driving";



document.getElementById("checkinData").innerHTML=
"CHECK IN : "
+
now.toLocaleTimeString();




if(navigator.geolocation){


navigator.geolocation.getCurrentPosition(async function(pos){



let lat=pos.coords.latitude;

let lon=pos.coords.longitude;



let place=await getLocationName(lat,lon);



// SIMPAN CHECK IN

localStorage.setItem(
"checkinLat",
lat
);


localStorage.setItem(
"checkinLon",
lon
);


localStorage.setItem(
"checkinPlace",
place
);



let mapLink=
"https://www.google.com/maps?q="
+
lat
+
","
+
lon;



localStorage.setItem(
"checkinMap",
mapLink
);





document.getElementById("checkinLocation").innerHTML=
"📍 CHECK IN LOCATION : "
+
place;



document.getElementById("openCheckinMap").style.display="block";



document.getElementById("openCheckinMap").onclick=function(){

window.open(
mapLink,
"_blank"
);

};

if(!userReady){
alert("Sila tunggu profile dimuatkan");
return;
}
const today = new Date().toLocaleDateString();

const q = query(
    collection(db, "attendance"),
    where("uid", "==", currentUser.uid),
    where("status", "==", "Working")
);

const snap = await getDocs(q);

let active = false;

snap.forEach((doc)=>{

let data = doc.data();

if(data.checkIn){

let date = data.checkIn.toDate().toLocaleDateString();

if(date === today){
active = true;
}

}

});


if(active){

alert("❌ Anda masih belum Check Out.");

return;

}


const ref = await addDoc(collection(db,"attendance"),{
  

uid: currentUser.uid,

name:driverName,

position:driverPosition,

email:driverEmail,

role: userRole,

status: "Working",

trackingStatus: "Running",

location: place,

checkIn: serverTimestamp(),
createdAt: serverTimestamp()

});


localStorage.setItem(
"attendanceID",
ref.id
);
document.getElementById("btn-checkin").disabled = true;
document.getElementById("btn-checkout").disabled = false;
saveTracking(lat, lon, "MULA");
startTracking(currentUser.uid);

alert("✅ Check In Berjaya");
localStorage.setItem(
"checkIn",
now
);

localStorage.setItem(
"status",
"Driving"
);

});

}


};










// ===============================
// CHECK OUT
// ===============================
let attendanceID="";

document.getElementById("btn-checkout").onclick=function(){


let now = new Date();


localStorage.setItem(
"checkOut",
now
);


localStorage.setItem(
"status",
"Standby"
);



document.getElementById("status").innerHTML="Standby";

document.getElementById("dashStatus").innerHTML="Standby";


document.getElementById("checkoutData").innerHTML =
"CHECK OUT : "
+
now.toLocaleTimeString();



calculateHour();



if(navigator.geolocation){


navigator.geolocation.getCurrentPosition(async function(pos){


let lat = pos.coords.latitude;

let lon = pos.coords.longitude;


let place = await getLocationName(lat,lon);



localStorage.setItem(
"checkoutLat",
lat
);


localStorage.setItem(
"checkoutLon",
lon
);


localStorage.setItem(
"checkoutPlace",
place
);



let mapLink =
"https://www.google.com/maps?q="
+
lat
+
","
+
lon;



localStorage.setItem(
"checkoutMap",
mapLink
);




document.getElementById("checkoutLocation").innerHTML =
"📍 CHECK OUT LOCATION : "
+
place;



document.getElementById("openCheckoutMap").style.display =
"block";



document.getElementById("openCheckoutMap").onclick=function(){

window.open(
mapLink,
"_blank"
);

};

let id = localStorage.getItem("attendanceID");


if(id){

let start = localStorage.getItem("checkIn");

let end = new Date();


let totalHour =
(end - new Date(start)) / 3600000;


let normalHour = 8;

let otHour = 0;


if(totalHour > normalHour){

otHour = totalHour - normalHour;

}


let otMoney = otHour * otRate;



await updateDoc(
doc(db,"attendance",id),

{
  
  

status:"Completed",

trackingStatus:"Stopped",

checkOut:end,

checkoutLocation: place,

totalHour:Number(totalHour.toFixed(2)),

otHour:Number(otHour.toFixed(2)),

otMoney:Number(otMoney.toFixed(2))

}

);
stopTracking();
lastLat = null;
lastLon = null;

}
alert("✅ Check Out Berjaya");

document.getElementById("btn-checkin").disabled = false;
document.getElementById("btn-checkout").disabled = true;
},
function(error){

alert("✅ Check Out Berjaya\nLokasi tidak dapat diambil");


});


}else{


alert("✅ Check Out Berjaya");


}


};

// LOCATION BUTTON
// ===============================

document.getElementById("btn-location").onclick=function(){


let lat =
localStorage.getItem("checkinLat");


let lon =
localStorage.getItem("checkinLon");



if(lat && lon){


alert(
"Latitude : "
+
lat
+
"\nLongitude : "
+
lon
);


}else{


alert("Belum ada lokasi");


}

// ===============================
// MAP BUTTON
// ===============================

document.getElementById("btn-map").onclick=function(){


let map =
localStorage.getItem("checkinMap");



if(map){


window.open(
map,
"_blank"
);


}else{


alert("Belum ada lokasi Check In");


}


};







// ===============================
// KIRA JAM KERJA
// ===============================
function calculateHour(){

let start =
localStorage.getItem("checkIn");

let end =
localStorage.getItem("checkOut");


if(start && end){


let total =
(new Date(end)-new Date(start))
/3600000;



let workHour = total.toFixed(2);



document.getElementById("totalData").innerHTML =
"TOTAL WORKING : "
+
workHour
+
" jam";


document.getElementById("dashHour").innerHTML =
workHour
+
" jam";



// =================
// KIRA OT
// =================


let normalHour = 8;

let currentOtRate = otRate;


let ot = 0;


if(total > normalHour){

    ot = total - normalHour;

}



let otMoney =
ot * currentOtRate;



document.getElementById("otData").innerHTML =
"OT : "
+
ot.toFixed(2)
+
" jam";



document.getElementById("otMoney").innerHTML =
"TOTAL OT : RM "
+
otMoney.toFixed(2);



document.getElementById("dashOT").innerHTML =
"RM "
+
otMoney.toFixed(2);



// simpan

localStorage.setItem(
"totalOT",
ot
);


localStorage.setItem(
"otMoney",
otMoney
);


}


}
// ===============================
// LOAD DATA SEMULA
// ===============================

window.onload=function(){



let status =
localStorage.getItem("status")
||
"Standby";



document.getElementById("status").innerHTML =
status;


document.getElementById("dashStatus").innerHTML =
status;





calculateHour();






// LOAD CHECK IN LOCATION

let checkinPlace =
localStorage.getItem("checkinPlace");



if(checkinPlace){


document.getElementById("checkinLocation").innerHTML =
"📍 CHECK IN LOCATION : "
+
checkinPlace;


}





let checkinMap =
localStorage.getItem("checkinMap");



if(checkinMap){


document.getElementById("openCheckinMap").style.display =
"block";



document.getElementById("openCheckinMap").onclick=function(){

window.open(
checkinMap,
"_blank"
);

};


}






// LOAD CHECK OUT LOCATION


let checkoutPlace =
localStorage.getItem("checkoutPlace");



if(checkoutPlace){


document.getElementById("checkoutLocation").innerHTML =
"📍 CHECK OUT LOCATION : "
+
checkoutPlace;


}





let checkoutMap =
localStorage.getItem("checkoutMap");



if(checkoutMap){


document.getElementById("openCheckoutMap").style.display =
"block";



document.getElementById("openCheckoutMap").onclick=function(){

window.open(
checkoutMap,
"_blank"
);

};


}



};




</script>
