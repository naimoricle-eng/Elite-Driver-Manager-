<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Elite Driver Manager</title>


<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<link rel="stylesheet"
href="css/style.css">



<style>

#wazeGoBtn img{
width:28px;
height:28px;
}


#map{

width:100%;

height:350px;

border-radius:12px;

margin-top:10px;

}


#searchBox{

width:100%;

padding:12px;

font-size:16px;

border-radius:8px;

border:1px solid #ccc;

}



.toast{

position:fixed;

top:10px;

right:10px;

background:#000;

color:white;

padding:10px;

border-radius:8px;

display:none;

z-index:9999;

}
.search-container{
position:relative;
width:100%;
}

#searchBox{
width:100%;
padding:12px;
padding-right:50px;
font-size:16px;
border-radius:8px;
border:1px solid #ccc;
}

#wazeGoBtn{
position:absolute;
right:5px;
top:50%;
transform:translateY(-50%);
border:none;
background:none;
padding:5px;
font-size:24px;
cursor:pointer;
}


</style>

</head>



<body>


<header>

<nav id="menu"></nav>

</header>



<main class="dashboard">


<h1>
Elite Driver Manager
</h1>



<h2 id="greeting"
style="display:none">
Welcome
</h2>





<section class="action-card">


<h2>
⚡ ACTION MENU
</h2>



<div class="action-list">



<!-- ONLY CHECK IN -->

<button 
id="btn-checkin"
type="button">

<span>
🚗
</span>

<span>
CHECK IN
</span>

</button>





<button
id="btn-checkout"
type="button"
disabled>


<span>
🛑
</span>

<span>
CHECK OUT
</span>


</button>





<select
id="driverStatus">


<option value="Driving">
🚗 Driving
</option>


<option value="Standby">
🟢 Standby
</option>


<option value="Lunch">
🍽️ Lunch
</option>


<option value="Toilet">
🚻 Toilet
</option>


<option value="Prayer">
🕌 Prayer
</option>


<option value="Refuel">
⛽ Refuel
</option>


<option value="Car Wash">
🧽 Car Wash
</option>


<option value="Rest">
😴 Rest
</option>


</select>





<button id="btn-map"
type="button">

🗺️ GOOGLE MAP

</button>





<button id="btn-places"
type="button">

📍 GO TO PLACES

</button>




</div>



<p id="status">

Standby

</p>



</section>





<div id="toast"
class="toast">

</div>





<!-- AUTO CAMERA -->

<input

type="file"

id="selfieInput"

accept="image/*"

capture="user"

style="display:none"

>




<section class="map-card">



<div class="search-container">

<input
id="searchBox"
placeholder="Taip tempat..."
>

<button id="wazeGoBtn" type="button">
<img src="images/waze.png">
</button>

</div>


<div id="map"></div>



</section>
<section class="attendance-card">


<h2>
📅 ATTENDANCE TODAY
</h2>



<p id="date">
DATE : -
</p>



<p id="checkinData">
CHECK IN : -
</p>



<p id="checkinLocation">
📍 CHECK IN LOCATION : -
</p>



<button
id="openCheckinMap"
type="button"
style="display:none">

🗺️ OPEN CHECK IN MAP

</button>




<hr>




<p id="checkoutData">
CHECK OUT : -
</p>



<p id="checkoutLocation">
📍 CHECK OUT LOCATION : -
</p>



<button
id="openCheckoutMap"
type="button"
style="display:none">

🗺️ OPEN CHECK OUT MAP

</button>



<hr>




<p id="totalData">
TOTAL WORKING : -
</p>



<p id="otData">
OT : -
</p>



<p id="otMoney">
TOTAL OT : -
</p>



</section>





<section class="summary">



<div class="card">

<h3>
STATUS
</h3>

<p id="dashStatus">
Standby
</p>

</div>





<div class="card">

<h3>
WORK HOUR
</h3>

<p id="dashHour">
0 jam
</p>

</div>





<div class="card">

<h3>
OT
</h3>

<p id="dashOT">
RM 0
</p>

</div>





<div class="card">

<h3>
CLAIM
</h3>

<p id="dashClaim">
RM 0
</p>


</div>



</section>



</main>




<footer>

</footer>





<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>



<script type="module"
src="js/dashboard.js"></script>



<script src="js/language.js" defer></script>

<script src="js/menu.js" defer></script>

<script src="js/theme.js" defer></script>



</body>

</html>
