<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Elite Driver Manager</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="menu"></div>
<div id="theme"></div>

<div class="dashboard">

<h1>Elite Driver Manager</h1>

<div class="action-card">

<h3>⚡ ACTION MENU</h3>

<div class="action-list">

<button id="btn-checkin">
🚗
<span>CHECK IN</span>
</button>

<button id="btn-checkout" disabled>
🛑
<span>CHECK OUT</span>
</button>
<select id="driverStatus">

<option value="Driving">🚗 Driving</option>

<option value="Standby">🟢 Standby</option>

<option value="Lunch">🍽️ Lunch</option>

<option value="Toilet">🚻 Toilet</option>

<option value="Prayer">🕌 Prayer</option>

<option value="Refuel">⛽ Refuel</option>

<option value="Car Wash">🧽 Car Wash</option>

<option value="Rest">😴 Rest</option>

</select>

<button id="btn-location">
📍
<span>LOCATION</span>
</button>

<button id="btn-map">
🗺️
<span>MAP</span>
</button>

</div>

<p id="status">Standby</p>

</div>


<input
type="file"
id="selfieInput"
accept="image/*"
capture="user"
style="display:none;">


<div class="attendance-card">

<h3>📅 ATTENDANCE TODAY</h3>

<p id="date">DATE : -</p>

<p id="checkinData">CHECK IN : -</p>

<p id="checkinLocation">📍 CHECK IN LOCATION : -</p>

<button id="openCheckinMap" style="display:none;">
🗺️ OPEN CHECK IN MAP
</button>

<hr>

<p id="checkoutData">CHECK OUT : -</p>

<p id="checkoutLocation">📍 CHECK OUT LOCATION : -</p>

<button id="openCheckoutMap" style="display:none;">
🗺️ OPEN CHECK OUT MAP
</button>

<hr>

<p id="totalData">TOTAL WORKING : -</p>

<p id="otData">OT : -</p>

<p id="otMoney">TOTAL OT : -</p>

</div>


<div class="summary">

<div class="card">
<h3>STATUS</h3>
<p id="dashStatus">Standby</p>
</div>

<div class="card">
<h3>WORK HOUR</h3>
<p id="dashHour">0 jam</p>
</div>

<div class="card">
<h3>OT</h3>
<p id="dashOT">RM 0</p>
</div>

<div class="card">
<h3>CLAIM</h3>
<p id="dashClaim">RM 0</p>
</div>

</div>

</div>

<script type="module" src="js/dashboard.js"></script>

<script src="js/language.js"></script>
<script src="js/menu.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
