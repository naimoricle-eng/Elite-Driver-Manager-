<!DOCTYPE html>
<html>

<head>
<title>Register Driver</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-box">

<img src="./images/logo.png" width="125">

<h2>Register Driver</h2>

<input type="text" id="name" placeholder="Nama Penuh">
<input type="tel" id="phone" placeholder="No. Telefon">

<input type="text" id="position" placeholder="Jawatan">
<input type="number" id="basicSalary" placeholder="Basic Salary (RM)">

<input type="number" id="workingDays" placeholder="Working Days / Month">

<input type="number" id="workingHours" placeholder="Working Hours / Day">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="register()">
REGISTER
</button>

<p id="message"></p>

<p>
Sudah ada akaun?
<a href="index.html">Login</a>
</p>

</div>

<script type="module" src="js/register.js"></script>

</body>
</html>
