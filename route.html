<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Driver Route</title>

  <link rel="stylesheet" href="./css/route.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div id="map" role="application" aria-label="Peta perjalanan"></div>

  <div id="timeline" aria-live="polite">
    <div class="timeline-header">
      <h3>📍 TRIP TIMELINE</h3>
      <div>
        <button id="saveHistoryBtn" class="btn small" aria-label="Save day history">Save Day History</button>
      </div>
    </div>
    <div id="timelineList">Loading...</div>
  </div>

  <!-- Floating Action Button (keeps UI similar to Google Timeline) -->
  <div class="fab" aria-hidden="true" id="fab" style="display:none">
    <div class="actions hide" id="fabActions" aria-hidden="true">
      <div style="display:flex;align-items:center;">
        <button id="editDayBtn" aria-label="Edit day"><span>Edit day</span></button>
        <div class="icon-circle" title="edit">✏️</div>
      </div>
      <div style="display:flex;align-items:center;">
        <button id="addVisitBtn" aria-label="Add visit"><span>Add visit</span></button>
        <div class="icon-circle" title="add">📍</div>
      </div>
      <div style="display:flex;align-items:center;">
        <button id="addNoteBtn" aria-label="Add note"><span>Add note</span></button>
        <div class="icon-circle" title="note">🗒️</div>
      </div>
      <div style="display:flex;align-items:center;">
        <button id="deleteDayBtn" aria-label="Delete day"><span>Delete day</span></button>
        <div class="icon-circle" title="delete">🗑️</div>
      </div>
    </div>

    <div>
      <button class="main" id="fabMain" aria-label="Open menu">✕</button>
    </div>
  </div>

  <!-- Modal for entering place names (replaces prompt) -->
  <div id="placeModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-content" role="document">
      <h4 id="placeModalTitle">Name this stop</h4>
      <input id="placeModalInput" aria-label="Place name" />
      <div class="modal-actions">
        <button id="placeModalCancel">Cancel</button>
        <button id="placeModalSave">Save</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/route.js"></script>
</body>
</html>
