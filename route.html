<!DOCTYPE html>
<html lang="ms">

<head>

<title>Driver Route</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="./css/route.css" />

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

</head>

<body>

<div id="map"></div>

<div id="timeline">

<div class="timeline-header">
  <h3>📍 TRIP TIMELINE</h3>
  <div>
    <button id="saveHistoryBtn" class="btn small">Save Day History</button>
  </div>
</div>

<div id="timelineList">
Loading...
</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module">

// Firebase DB already exported from your existing ./js/firebase.js
import { db } from "./js/firebase.js";

import {
  collection,
  getDocs,
  getDoc,
  doc,
  query,
  orderBy,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/*
  Behavior implemented:
  - draw route polyline and markers
  - animate a car marker along the route (time-compressed)
  - detect stops >= 5 minutes (and small distance) then prompt user to name place
  - allow manual "Add visit" buttons in timeline for missing place names
  - save day's history to localStorage and write place names to Firestore tracking docs by updating them
*/

const map = L.map("map").setView([3.1390,101.6869],11);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19
  }
).addTo(map);

// get attendance ID from URL
const params = new URLSearchParams(window.location.search);
const attendanceID = params.get("id");
console.log("ID:", attendanceID);

if(!attendanceID){
    alert("Attendance ID tidak dijumpai");
    throw new Error("Attendance ID kosong");
}

const attendanceDoc = await getDoc(
    doc(db,"attendance",attendanceID)
);

const attendanceData = attendanceDoc.data();
console.log("Attendance:", attendanceData);

// fetch tracking subcollection ordered by time
const trackingQuery = query(
    collection(
        db,
        "attendance",
        attendanceID,
        "tracking"
    ),
    orderBy("time","asc")
);

const trackingSnap = await getDocs(trackingQuery);

if(trackingSnap.empty){
    alert("Tiada data tracking");
    throw new Error("Tiada data tracking");
}

// Build an array of points with times and refs for easy manipulation
let points = []; // {lat, lng, timeMs, place, docRef, rawTime}
trackingSnap.docs.forEach((d)=>{
  const data = d.data();
  let ts = null;
  if(data.time){
    if(data.time.toDate){
      ts = data.time.toDate();
    } else {
      ts = new Date(data.time);
    }
  } else {
    ts = new Date(); // fallback
  }
  points.push({
    lat: data.latitude,
    lng: data.longitude,
    timeMs: ts.getTime(),
    place: data.place || null,
    docRef: d.ref,
    raw: data
  });
});

// helper distance (km)
function calculateDistance(lat1, lon1, lat2, lon2){
    let R = 6371; // KM
    let dLat = (lat2-lat1) * Math.PI / 180;
    let dLon = (lon2-lon1) * Math.PI / 180;
    let a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) *
    Math.sin(dLon/2);
    let c = 2 * Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );
    return R * c;
}

// Create timeline HTML with Add Visit buttons for missing places
const timelineList = document.getElementById("timelineList");
let totalDistance = 0;
let timelineHTML = "";

for(let i=0;i<points.length;i++){
  const p = points[i];
  // compute distance to previous
  if(i>0){
    totalDistance += calculateDistance(
      points[i-1].lat, points[i-1].lng,
      p.lat, p.lng
    );
  }

  // formatted time
  let timeStr = "-";
  try{
    timeStr = new Date(p.timeMs).toLocaleString("ms-MY");
  }catch(e){}

  // determine if there is a long stop after this point (look at delta to next point)
  let stopAfter = false;
  if(i < points.length - 1){
    const deltaMs = points[i+1].timeMs - p.timeMs;
    const distKm = calculateDistance(p.lat,p.lng, points[i+1].lat, points[i+1].lng);
    // treat as stop if delta >= 5 minutes and movement small (<0.05 km => 50m)
    if(deltaMs >= 5*60*1000 && distKm <= 0.05){
      stopAfter = true;
    }
  }

  // If place is missing, show missing visit UI
  if(!p.place && stopAfter){
    timelineHTML += `
      <div class="timeline-item" id="timeline-item-${i}">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <strong style="color:#d32f2f">Missing visit</strong><br>
            <small>Left at ${timeStr}</small>
          </div>
          <div>
            <button class="btn-outline small" onclick="addVisit(${i})">+ Add visit</button>
          </div>
        </div>
      </div>
    `;
  } else {
    timelineHTML += `
      <div class="timeline-item" id="timeline-item-${i}">
        <div><strong>${p.place ? p.place : "Tracking Point"}</strong></div>
        <div style="color:#666">${timeStr}</div>
        ${!p.place ? `<div class="add-visit"><button class="btn-outline small" onclick="addVisit(${i})">Add visit</button></div>` : ''}
      </div>
    `;
  }
}

timelineHTML += `
  <div class="timeline-item">
    <div><strong>🚗 Total Distance</strong></div>
    <div style="font-size:18px">${totalDistance.toFixed(2)} KM</div>
  </div>
`;

timelineList.innerHTML = timelineHTML;

// draw polyline and markers
const routePoints = points.map(p=>[p.lat,p.lng]);

const polyline = L.polyline(routePoints, { color:"blue", weight:5 }).addTo(map);
map.fitBounds(polyline.getBounds());

// add markers for check in/out if present
if(attendanceData.checkIn && routePoints.length>0){
  let checkInTime = attendanceData.checkIn.toDate ? attendanceData.checkIn.toDate().toLocaleString("ms-MY") : new Date(attendanceData.checkIn).toLocaleString("ms-MY");
  L.marker(routePoints[0]).addTo(map).bindPopup("🟢 CHECK IN<br>📍 " + (attendanceData.location || "-") + "<br>🕒 " + checkInTime);
}
if(attendanceData.checkOut && routePoints.length>0){
  let checkOutTime = attendanceData.checkOut.toDate ? attendanceData.checkOut.toDate().toLocaleString("ms-MY") : new Date(attendanceData.checkOut).toLocaleString("ms-MY");
  L.marker(routePoints[routePoints.length-1]).addTo(map).bindPopup("🔴 CHECK OUT<br>📍 " + (attendanceData.checkoutLocation || "-") + "<br>🕒 " + checkOutTime);
}

// Create a car icon (using emoji in a div icon so we don't need extra assets)
const carIcon = L.divIcon({
  html: `<div style="font-size:22px; transform: translate(-50%,-50%);">🚗</div>`,
  className: '',
  iconSize: [28,28],
  iconAnchor: [14,14]
});

// moving marker
let movingMarker = L.marker(routePoints[0], { icon: carIcon }).addTo(map);

// animate along points using time differences (time-compressed)
async function animateAlongPoints(pointsArray){
  if(pointsArray.length <= 1) return;
  // speed compression factor (real time / factor)
  // e.g., factor = 30 compresses 30x (so a 30-min gap lasts 1 minute)
  const speedFactor = 30;
  const handledStops = new Set();

  for(let i=0;i<pointsArray.length-1;i++){
    const p1 = pointsArray[i];
    const p2 = pointsArray[i+1];

    const segmentDistance = calculateDistance(p1.lat, p1.lng, p2.lat, p2.lng); // km
    // compute duration (ms) based on time difference, compressed
    let dt = p2.timeMs - p1.timeMs;
    if(!dt || dt <= 0) dt = 2000; // fallback 2s
    let durationMs = Math.max(800, Math.floor(dt / speedFactor));

    // animate linear interpolation between p1 -> p2 over durationMs
    const frames = Math.max(8, Math.floor(durationMs / 40)); // ~25fps clamp
    for(let f=1; f<=frames; f++){
      const t = f/frames;
      const lat = p1.lat + (p2.lat - p1.lat) * t;
      const lng = p1.lng + (p2.lng - p1.lng) * t;
      movingMarker.setLatLng([lat,lng]);
      await new Promise(res => setTimeout(res, Math.floor(durationMs/frames)));
    }

    // arrived at p2 - after arriving, check for a stop after p2 (i.e., gap to next point)
    if(i+1 < pointsArray.length - 1){
      const deltaMs = pointsArray[i+2].timeMs - p2.timeMs;
      const distNext = calculateDistance(p2.lat, p2.lng, pointsArray[i+2].lat, pointsArray[i+2].lng);
      if(deltaMs >= 5*60*1000 && distNext <= 0.05){
        // we consider this a stop. If not handled already, prompt user to add place
        if(!handledStops.has(i+1)){
          // small delay so UI updates first
          await new Promise(res => setTimeout(res, 200));
          // Prompt the user
          const defaultName = pointsArray[i+1].place || `Location (${p2.lat.toFixed(5)}, ${p2.lng.toFixed(5)})`;
          const placeName = prompt(`You stopped for ${(deltaMs/60000).toFixed(0)} minutes here. Enter place name:`, defaultName);
          if(placeName && placeName.trim() !== ""){
            // Update Firestore doc (if docRef exists)
            try{
              if(pointsArray[i+1].docRef){
                await updateDoc(pointsArray[i+1].docRef, { place: placeName });
                // reflect locally in pointsArray & timeline UI
                pointsArray[i+1].place = placeName;
                const el = document.getElementById(`timeline-item-${i+1}`);
                if(el) el.querySelector('strong').innerText = placeName;
              }
            }catch(err){
              console.error("Failed to update place in Firestore", err);
              alert("Gagal menyimpan tempat ke Firestore: " + err.message);
            }
            // save to local history
            addToLocalHistory({
              type: "stop",
              timeMs: p2.timeMs,
              lat: p2.lat,
              lng: p2.lng,
              place: placeName,
              durationMin: Math.round(deltaMs/60000)
            });
          } else {
            // still save a record that there was an unnamed stop
            addToLocalHistory({
              type: "stop",
              timeMs: p2.timeMs,
              lat: p2.lat,
              lng: p2.lng,
              place: null,
              durationMin: Math.round(deltaMs/60000)
            });
          }
          handledStops.add(i+1);
        }
      }
    }
  }
}

// Local history saving function (stores an array per day/attendance)
function addToLocalHistory(entry){
  // Use a key per attendanceID & date (YYYY-MM-DD)
  const dateKey = new Date().toISOString().slice(0,10); //yyyy-mm-dd
  const localKey = `timeline_history_${attendanceID}_${dateKey}`;
  let arr = [];
  try{
    const raw = localStorage.getItem(localKey);
    if(raw) arr = JSON.parse(raw);
  }catch(e){ arr = []; }
  arr.push(entry);
  try{
    localStorage.setItem(localKey, JSON.stringify(arr));
    console.log("Saved to local history", localKey, entry);
  }catch(e){
    console.warn("Failed to save local history", e);
  }
}

// manual "Add visit" invoked by timeline buttons
window.addVisit = async function(index){
  const p = points[index];
  if(!p) return alert("Point not found");
  const defaultName = p.place || `Location (${p.lat.toFixed(5)}, ${p.lng.toFixed(5)})`;
  const placeName = prompt("Enter place name for this visit:", defaultName);
  if(placeName && placeName.trim() !== ""){
    try{
      if(p.docRef){
        await updateDoc(p.docRef, { place: placeName });
        p.place = placeName;
        const el = document.getElementById(`timeline-item-${index}`);
        if(el) el.querySelector('strong').innerText = placeName;
        addToLocalHistory({
          type: "visit",
          timeMs: p.timeMs,
          lat: p.lat,
          lng: p.lng,
          place: placeName
        });
        alert("Place saved.");
      } else {
        alert("No docRef available to update in Firestore.");
      }
    }catch(err){
      console.error("Failed saving visit", err);
      alert("Gagal menyimpan ke Firestore: " + err.message);
    }
  }
};

// Save day history button: collect local entries for the day and copy to a master local key (or optionally send to Firestore)
document.getElementById("saveHistoryBtn").addEventListener("click", ()=>{
  const dateKey = new Date().toISOString().slice(0,10);
  const localKey = `timeline_history_${attendanceID}_${dateKey}`;
  const raw = localStorage.getItem(localKey);
  if(!raw){
    alert("Tiada sejarah untuk hari ini disimpan lagi.");
    return;
  }
  // Optionally: confirm or show
  alert("Sejarah hari ini disimpan secara setempat (localStorage). Key: " + localKey);
  console.log("Saved history:", localKey, JSON.parse(raw));
});

// Start animation
animateAlongPoints(points).catch(err=>{
  console.error("Animation error:", err);
});

// Optionally: you can also auto-save an overall day summary now that we have points
(function autoSaveDaySummary(){
  try{
    const dateKey = new Date().toISOString().slice(0,10);
    const summaryKey = `timeline_summary_${attendanceID}_${dateKey}`;
    const summary = {
      savedAt: new Date().toISOString(),
      totalDistanceKm: totalDistance,
      pointCount: points.length,
      timestampSample: points.length ? new Date(points[0].timeMs).toISOString() : new Date().toISOString()
    };
    localStorage.setItem(summaryKey, JSON.stringify(summary));
    console.log("Saved day summary:", summaryKey, summary);
  }catch(e){console.warn("Failed save day summary", e);}
})();

</script>

</body>

</html>
