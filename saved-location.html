<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Saved Location - Elite Driver Manager</title>

<link rel="stylesheet" href="css/style.css">

<style>

.container{
padding:20px;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:12px;
}

.input{
width:100%;
padding:12px;
font-size:16px;
margin-bottom:10px;
}

.btn{
padding:12px;
border:0;
border-radius:8px;
background:#0a74da;
color:white;
margin-top:5px;
}

.btn-danger{
padding:12px;
border:0;
border-radius:8px;
background:#d9534f;
color:white;
}

</style>

</head>


<body>


<div id="menu"></div>


<div class="container">


<h2>
📍 Saved Location
</h2>


<div class="card">


<input
id="placeName"
class="input"
placeholder="Contoh: Rumah Boss">


<button
id="saveBtn"
class="btn">

⭐ SIMPAN LOKASI SEKARANG

</button>


<p id="gpsStatus">

📡 Mencari GPS...

</p>


</div>



<h3>
Lokasi Disimpan
</h3>


<div id="list">

Loading...

</div>


</div>



<script type="module">


import {

savePlace,
loadPlaces,
deletePlace,
editPlace

}

from "./js/savedPlaces.js";



let currentLat=null;
let currentLon=null;



// =====================
// GET GPS
// =====================

navigator.geolocation.watchPosition(

(position)=>{


currentLat =
position.coords.latitude;


currentLon =
position.coords.longitude;



document.getElementById(
"gpsStatus"
).innerHTML =

"✅ GPS Ready";


},


()=>{


document.getElementById(
"gpsStatus"
).innerHTML =

"❌ GPS gagal";


},


{

enableHighAccuracy:true

}


);



// =====================
// SAVE
// =====================

document
.getElementById("saveBtn")
.onclick=async()=>{


let name =
document
.getElementById("placeName")
.value.trim();



if(!name){

alert(
"Masukkan nama tempat"
);

return;

}



if(!currentLat){

alert(
"GPS belum siap"
);

return;

}



await savePlace(

name,

currentLat,

currentLon

);



document
.getElementById("placeName")
.value="";



loadList();



alert(
"✅ Lokasi disimpan"
);



};



// =====================
// LOAD LIST
// =====================

async function loadList(){


let places =
await loadPlaces();



let html="";



if(places.length===0){


html =
"Tiada lokasi disimpan";


}



places.forEach((p)=>{


html += `

<div class="card">


<h3>
📍 ${p.name}
</h3>


<p>

Latitude:
${p.latitude}

<br>

Longitude:
${p.longitude}

</p>



<button
class="btn"
onclick="openMap(
${p.latitude},
${p.longitude}
)">

🗺️ BUKA MAP

</button>


<br><br>


<button
class="btn"
onclick="editLocation(
'${p.id}',
'${p.name}'
)">

✏️ EDIT

</button>


<button
class="btn-danger"
onclick="deleteLocation(
'${p.id}'
)">

🗑️ DELETE

</button>



</div>

`;

});


document
.getElementById("list")
.innerHTML =
html;


}




// =====================
// OPEN GOOGLE MAP
// =====================

window.openMap =
function(lat,lon){


window.open(

"https://www.google.com/maps?q="+lat+","+lon,

"_blank"

);


};



// =====================
// EDIT
// =====================

window.editLocation =
async function(id,name){


let newName =
prompt(
"Nama baru:",
name
);



if(newName){

await editPlace(
id,
newName
);


loadList();

}


};



// =====================
// DELETE
// =====================

window.deleteLocation =
async function(id){


if(confirm(
"Padam lokasi?"
)){


await deletePlace(id);


loadList();


}

};



loadList();


</script>


<script src="js/menu.js"></script>


</body>

</html>
